<section id="contacto" class="py-5 bg-light">

  <div class="container">

    <div class="text-center mb-5">

      <span class="badge bg-primary mb-2">
        Inscripciones
      </span>

      <h2 class="fw-bold">
        ¿Quieres aprender un idioma?
      </h2>

      <p class="text-muted">
        Déjanos tus datos y nos pondremos en contacto contigo.
      </p>

    </div>

    <div class="row justify-content-center">

      <div class="col-lg-8">

        <div class="card border-0 shadow p-4">

          <form>

            <div class="row">

              <!-- Nombre -->
              <div class="col-md-6 mb-3">

                <label class="form-label">
                  Nombre completo
                </label>

                <input
                  type="text"
                  class="form-control"
                  placeholder="Ingresa tu nombre">

              </div>

              <!-- Correo -->
              <div class="col-md-6 mb-3">

                <label class="form-label">
                  Correo electrónico
                </label>

                <input
                  type="email"
                  class="form-control"
                  placeholder="ejemplo@gmail.com">

              </div>

            </div>

            <!-- Teléfono -->
            <div class="mb-3">

              <label class="form-label">
                Teléfono
              </label>

              <input
                type="tel"
                class="form-control"
                placeholder="999 999 999">

            </div>

            <!-- Idioma -->
            <div class="mb-3">

              <label class="form-label">
                ¿Qué idioma quieres aprender?
              </label>

              <select class="form-select">

                <option value="">
                  Selecciona un idioma
                </option>

                <option>
                  Inglés
                </option>

                <option>
                  Francés
                </option>

                <option>
                  Alemán
                </option>

                <option>
                  Italiano
                </option>

              </select>

            </div>

            <!-- Mensaje -->
            <div class="mb-3">

              <label class="form-label">
                Mensaje
              </label>

              <textarea
                class="form-control"
                rows="4"
                placeholder="Escribe tu consulta...">
              </textarea>

            </div>

            <!-- Botón -->
            <div class="text-center">

              <button
                type="button"
                class="btn btn-primary btn-lg">

                <i class="bi bi-send me-2"></i>

                Enviar inscripción

              </button>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

</section>
